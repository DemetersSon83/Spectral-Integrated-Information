[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phispectral"
version = "0.1.0"
description = "CLI + library for Φ_spectral (spectral integrated information) over time-series data."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Mark M. Bailey", email = "mark@drmmbailey.com"}
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "networkx>=3.1"
]

[project.scripts]
phispectral = "phispectral.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
